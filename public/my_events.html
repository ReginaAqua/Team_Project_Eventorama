<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Events - Eventorama</title>
  <link rel="stylesheet" href="style.css">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Leaflet Control Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <style>
    /* (Optional) Styling for the stats display */
    .statsDisplay {
      margin-top: 5px;
      font-size: 0.85rem;
      color: #6F2C91;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <!-- Logo with home link -->
      <div class="site-logo">
        <a href="index.html">
          <img src="images/eventorama_logo.png" alt="Eventorama Logo" width="80" height="80">
        </a>
      </div>
      <!-- Navigation buttons -->
      <nav class="main-nav">
        <button id="backBtn">Back to Main</button>
        <button id="logoutBtn" style="display:none;">Logout</button>
      </nav>
    </div>
  </header>

  <main>
    <h2>My Events</h2>
    <div id="myEventsContainer"></div>
  </main>

  <!-- Modal for Editing an Event (only the user's own events) -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close" id="editClose">&times;</span>
      <h2>Edit Event</h2>
      <form id="editEventForm" enctype="multipart/form-data">
        <input type="hidden" name="eventId" id="editEventId">

        <label for="editEventName">Event Name:</label>
        <input type="text" name="eventName" id="editEventName" required>

        <label for="editDate">Date:</label>
        <input type="date" name="date" id="editDate" required>

        <label for="editTime">Time:</label>
        <input type="time" name="time" id="editTime" required>

        <label for="editDescription">Description:</label>
        <textarea name="description" id="editDescription" required></textarea>

        <label for="editCategory">Category:</label>
        <select name="editCategory" id="editCategory">
          <option value="">Select category</option>
          <option value="Music">Music</option>
          <option value="Nightlife">Nightlife</option>
          <option value="Arts & Culture">Arts & Culture</option>
          <option value="Education">Education</option>
          <option value="Sports & Fitness">Sports & Fitness</option>
          <option value="Social">Social</option>
          <option value="Food & Drink">Food & Drink</option>
          <option value="Charity">Charity</option>
          <option value="Seasonal">Seasonal</option>
          <option value="Other">Other</option>
        </select>

        <label for="editDisplayLocation">Short Address (Optional):</label>
        <input type="text" name="displayLocation" id="editDisplayLocation" placeholder="Store name or short address">

        <label for="editPoster">Event Poster (optional):</label>
        <input type="file" name="poster" id="editPoster" accept="image/*">
        
        <!-- Map for selecting full (long) address during editing -->
        <div class="map-container">
          <div id="mapEdit"></div>
        </div>
        <!-- Hidden fields for lat, lon, and full address -->
        <input type="hidden" name="lat" id="editLat">
        <input type="hidden" name="lon" id="editLon">
        <input type="hidden" name="location" id="editLocation">
        <input type="hidden" name="city" id="editCity">

        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2025 Eventorama</p>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Leaflet Control Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const backBtn = document.getElementById("backBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const myEventsContainer = document.getElementById("myEventsContainer");

      // Edit modal references
      const editModal = document.getElementById("editModal");
      const editClose = document.getElementById("editClose");
      const editEventForm = document.getElementById("editEventForm");
      const editEventId = document.getElementById("editEventId");
      const editEventName = document.getElementById("editEventName");
      const editDate = document.getElementById("editDate");
      const editTime = document.getElementById("editTime");
      const editDescription = document.getElementById("editDescription");
      const editDisplayLocation = document.getElementById("editDisplayLocation");
      const editLat = document.getElementById("editLat");
      const editLon = document.getElementById("editLon");
      const editLocation = document.getElementById("editLocation");
      const editCategory = document.getElementById("editCategory");

      let currentUser = localStorage.getItem("currentUser") || null;
      if (!currentUser) {
        window.location.href = "index.html";
      }

      logoutBtn.style.display = "inline-block";

      backBtn.addEventListener("click", () => {
        window.location.href = "index.html";
      });
      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("currentUser");
        localStorage.removeItem("currentUserRole");
        window.location.href = "index.html";
      });

      // Close the edit modal
      editClose.addEventListener("click", () => {
        editModal.style.display = "none";
      });
      window.addEventListener("click", (e) => {
        if (e.target === editModal) {
          editModal.style.display = "none";
        }
      });

      async function fetchMyEvents() {
        const response = await fetch("../backend/api.php?endpoint=events&action=get");
        const result = await response.json();
        if (result.success && result.events) {
          const myEvents = result.events.filter(ev => ev.username === currentUser);
          displayMyEvents(myEvents);
        } else {
          myEventsContainer.innerHTML = "<p>No events found.</p>";
        }
      }

      function displayMyEvents(events) {
        myEventsContainer.innerHTML = "";
        if (events.length === 0) {
          myEventsContainer.innerHTML = "<p>You have not created any events yet.</p>";
          return;
        }
        events.forEach(ev => {
          const eventDiv = document.createElement("div");
          eventDiv.className = "event";
          eventDiv.setAttribute("data-eventid", ev.id);
          eventDiv.setAttribute("data-eventname", ev.eventName);
          eventDiv.setAttribute("data-date", ev.date);
          eventDiv.setAttribute("data-time", ev.time);
          eventDiv.setAttribute("data-description", ev.description || "");
          eventDiv.setAttribute("data-displayLocation", ev.displayLocation || "");
          eventDiv.setAttribute("data-location", ev.location || "");
          eventDiv.setAttribute("data-category", ev.category || "");

          // Notice the new 'Show Stats' button
          eventDiv.innerHTML = `
            <div class="event-content">
              <p><strong>${ev.eventName}</strong> (${ev.date} ${ev.time})</p>
              ${ev.category ? `<p><em>Category: ${ev.category}</em></p>` : ""}
              <p>${ev.displayLocation ? ev.displayLocation : ""}</p>
              <a href="event_details.html?id=${ev.id}">Details</a>
              <button data-eventid="${ev.id}" class="statsBtn">Show Stats</button>
              <button data-eventid="${ev.id}" class="editBtn">Edit</button>
              <button data-eventid="${ev.id}" class="deleteBtn">Delete</button>
            </div>
          `;
          myEventsContainer.appendChild(eventDiv);
        });
        attachEventListeners();
      }

      function attachEventListeners() {
        // Show Stats button
        document.querySelectorAll(".statsBtn").forEach(btn => {
          btn.addEventListener("click", async () => {
            const eventId = btn.dataset.eventid;
            const statsUrl = `../backend/api.php?endpoint=events&action=stats&eventId=${eventId}&username=${currentUser}`;
            const res = await fetch(statsUrl);
            const data = await res.json();
            if (data.success) {
              // Create or update a <p> below the button to display stats
              const parentDiv = btn.parentNode;
              let statsDisplay = parentDiv.querySelector(".statsDisplay");
              if (!statsDisplay) {
                statsDisplay = document.createElement("p");
                statsDisplay.className = "statsDisplay";
                parentDiv.appendChild(statsDisplay);
              }
              statsDisplay.innerText =
                `Going Average Age: ${data.going_avg !== null ? data.going_avg : 'N/A'} | Thinking Average Age: ${data.thinking_avg !== null ? data.thinking_avg : 'N/A'}`;
            } else {
              alert(data.message);
            }
          });
        });

        // Edit button
        document.querySelectorAll(".editBtn").forEach(btn => {
          btn.addEventListener("click", () => {
            const eventDiv = btn.closest(".event");
            editEventId.value = eventDiv.getAttribute("data-eventid");
            editEventName.value = eventDiv.getAttribute("data-eventname");
            editDate.value = eventDiv.getAttribute("data-date");
            editTime.value = eventDiv.getAttribute("data-time");
            editDescription.value = eventDiv.getAttribute("data-description");
            editDisplayLocation.value = eventDiv.getAttribute("data-displayLocation");
            editCategory.value = eventDiv.getAttribute("data-category") || "";
            document.getElementById("editPoster").value = "";
            editModal.style.display = "block";
            initializeEditMap();
          });
        });

        // Delete button
        document.querySelectorAll(".deleteBtn").forEach(btn => {
          btn.addEventListener("click", async () => {
            const eventId = btn.dataset.eventid;
            if (!confirm("Are you sure you want to delete this event?")) return;
            const formData = new FormData();
            formData.append("action", "delete");
            formData.append("eventId", eventId);
            formData.append("username", currentUser);
            formData.append("role", localStorage.getItem("currentUserRole") || "");
            const response = await fetch("../backend/api.php?endpoint=events", {
              method: "POST",
              body: formData
            });
            const result = await response.json();
            if (result.success) {
              alert("Event deleted!");
              fetchMyEvents();
            } else {
              alert(result.message);
            }
          });
        });
      }

      let mapEdit, markerEdit, geocoderEdit;
      function initializeEditMap() {
        if (mapEdit) {
          mapEdit.remove();
        }
        let defaultLat = 37.9838, defaultLon = 23.7275;
        if (editLat.value && editLon.value) {
          defaultLat = editLat.value;
          defaultLon = editLon.value;
        }
        mapEdit = L.map("mapEdit").setView([defaultLat, defaultLon], 15);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '© OpenStreetMap contributors'
        }).addTo(mapEdit);
        markerEdit = L.marker([defaultLat, defaultLon]).addTo(mapEdit);
        geocoderEdit = L.Control.geocoder({
          defaultMarkGeocode: false
        })
          .on("markgeocode", function(e) {
            const center = e.geocode.center;
            markerEdit.setLatLng(center);
            mapEdit.setView(center, 15);
            markerEdit.bindPopup(e.geocode.name).openPopup();
            editLat.value = center.lat;
            editLon.value = center.lng;
            editLocation.value = e.geocode.name;
          })
          .addTo(mapEdit);
      }

      fetchMyEvents();
    });
  </script>
</body>
</html>
