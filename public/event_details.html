<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Details</title>
  <link rel="stylesheet" href="style.css">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
  <header style="background: linear-gradient(135deg, #6F2C91, #c86dd7); padding: 10px; color: #fff;">
    <h1 style="margin-left: 20px;">Event Details</h1>
  </header>

  <main style="width: 90%; max-width: 800px; margin: 20px auto;">
    <button id="backBtn" style="margin-bottom: 20px; background-color: #fff; color: #6F2C91; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;">← Back to Main</button>
    <div id="eventDetails" style="background-color: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 8px;"></div>
    <div id="mapDetail"></div>
  </main>

  <footer style="text-align:center; margin: 20px auto;">
    <p>© 2025 Eventorama</p>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    let currentUser = localStorage.getItem("currentUser") || null;
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get("id");
    const backBtn = document.getElementById("backBtn");
    backBtn.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    async function loadEvent() {
      const response = await fetch("../backend/api.php?endpoint=events&action=get");
      const result = await response.json();
      if (result.success && result.events) {
        const ev = result.events.find(e => e.id === eventId);
        if (!ev) {
          document.getElementById("eventDetails").innerHTML = "<p>Event not found.</p>";
          return;
        }
        let html = `
          <h2 style="color:#6F2C91;">${ev.eventName}</h2>
          <p><strong>Date/Time:</strong> ${ev.date} ${ev.time}</p>
          <p><strong>Description:</strong> ${ev.description}</p>
        `;
        const fullAddress = ev.location ? ev.location : "No address provided";
        if (ev.lat && ev.lon) {
          const gMapsLink = `https://www.google.com/maps/search/?api=1&query=${ev.lat},${ev.lon}`;
          html += `<p><strong>Address:</strong> ${fullAddress} <br>
                    (<a href="${gMapsLink}" target="_blank">Open in Google Maps</a>)</p>`;
        } else {
          html += `<p><strong>Address:</strong> ${fullAddress}</p>`;
        }
        if (ev.poster) {
          html += `<img src="${ev.poster}" alt="Event Poster" style="max-width:300px; display:block; margin:10px 0;">`;
        }
        const goingCount = ev.going && Array.isArray(ev.going) ? ev.going.length : 0;
        const thinkingCount = ev.thinking && Array.isArray(ev.thinking) ? ev.thinking.length : 0;
        html += `<p><strong>Going:</strong> ${goingCount} | <strong>Thinking:</strong> ${thinkingCount}</p>`;
        if (currentUser) {
          html += `
            <button id="goingBtn" style="background-color:#6F2C91; color:#fff; border:none; padding:10px 16px; border-radius:20px; font-weight:bold; cursor:pointer;">Going</button>
            <button id="thinkingBtn" style="background-color:#6F2C91; color:#fff; border:none; padding:10px 16px; border-radius:20px; font-weight:bold; cursor:pointer;">Thinking</button>
          `;
        }
        document.getElementById("eventDetails").innerHTML = html;
        if (currentUser) {
          document.getElementById("goingBtn").addEventListener("click", async () => {
            await voteAction("going");
          });
          document.getElementById("thinkingBtn").addEventListener("click", async () => {
            await voteAction("thinking");
          });
        }
        async function voteAction(type) {
          const formData = new FormData();
          formData.append("vote", type);
          formData.append("eventId", ev.id);
          formData.append("username", currentUser);
          const res = await fetch("../backend/api.php?endpoint=events", { method: "POST", body: formData });
          const data = await res.json();
          if (data.success) {
            loadEvent();
          } else {
            alert(data.message);
          }
        }
        // Initialize the map using the event's coordinates
        if (ev.lat && ev.lon) {
          initMap(ev.lat, ev.lon, fullAddress);
        } else {
          document.getElementById("mapDetail").innerHTML = "<p>Map not available.</p>";
        }
      } else {
        document.getElementById("eventDetails").innerHTML = "<p>No events data.</p>";
      }
    }

    function initMap(lat, lon, address) {
      const map = L.map("mapDetail").setView([lat, lon], 15);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
      const marker = L.marker([lat, lon]).addTo(map);
      marker.bindPopup(address).openPopup();
    }

    loadEvent();
  </script>
</body>
</html>
