<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Calendar - Map Integration</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Leaflet Control Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
</head>
<body>
  <header>
    <div class="header-container">
      <div class="site-logo">
        <a href="index.html">
          <img src="images/eventorama_logo.png" alt="Eventorama Logo" width="80" height="80">
        </a>
      </div>
      <nav class="main-nav">
        <button id="loginBtn">Login</button>
        <button id="signupBtn">Sign Up</button>
        <button id="logoutBtn" style="display:none;">Logout</button>
        <button id="myEventsBtn" style="display:none;">My Events</button>
        <button id="reviewReportsBtn" style="display:none;">Review Reports</button>
      </nav>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="search-bar-container" style="width: 90%; max-width: 1200px; margin: 20px auto; display: flex; gap: 10px;">
    <input type="text" id="searchInput" placeholder="Search by title, category, or location" style="flex: 1; padding: 8px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px;">
    <button id="searchBtn" style="padding: 8px 12px; background-color: #6F2C91; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Search</button>
  </div>

  <main>
    <section class="sidebar-left">
      <div class="date-picker">
        <h3>Select a Date to View Events</h3>
        <input type="date" id="viewDate">
        <button id="viewDateBtn">View Events</button>
      </div>
      <div class="category-filter">
        <label for="categoryFilter">Filter by Category:</label>
        <select id="categoryFilter">
          <option value="">All Categories</option>
          <option value="Music">Music</option>
          <option value="Nightlife">Nightlife</option>
          <option value="Arts & Culture">Arts & Culture</option>
          <option value="Education">Education</option>
          <option value="Sports & Fitness">Sports & Fitness</option>
          <option value="Social">Social</option>
          <option value="Food & Drink">Food & Drink</option>
          <option value="Charity">Charity</option>
          <option value="Seasonal">Seasonal</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="city-filter">
        <label for="cityFilterSelect">Filter by City:</label>
        <select id="cityFilterSelect">
          <option value="">All Cities</option>
        </select>
      </div>
      <button id="openCreateModalBtn" class="create-btn" style="display:none;">Create Event</button>
    </section>

    <section class="main-listing">
      <h2>All Events</h2>
      <div id="calendar"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 Eventorama</p>
  </footer>

  <!-- Modal for Login/Sign Up -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="authForm">
        <h2 id="modalTitle">Login</h2>
        <form id="loginForm">
          <input type="hidden" name="action" value="login">
          <label for="username">Username:</label>
          <input type="text" name="username" required>
          <label for="password">Password:</label>
          <input type="password" name="password" required>
          <button type="submit">Submit</button>
        </form>
        <form id="signupForm" style="display:none;">
          <input type="hidden" name="action" value="register">
          <label for="username">Username:</label>
          <input type="text" name="username" required>
          <label for="email">Email:</label>
          <input type="email" name="email" required>
          <label for="dob">Date of Birth:</label>
          <input type="date" name="dob" required>
          <label for="password">Password:</label>
          <input type="password" name="password" required>
          <label for="confirm_password">Confirm Password:</label>
          <input type="password" name="confirm_password" required>
          <button type="submit">Register</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal for Creating an Event -->
  <div id="createModal" class="modal">
    <div class="modal-content">
      <span class="close" id="createClose">&times;</span>
      <h2>Create Event</h2>
      <form id="createEventForm" enctype="multipart/form-data">
        <label for="eventName">Event Name:</label>
        <input type="text" name="eventName" id="eventName" required>
        <label for="date">Date:</label>
        <input type="date" name="date" id="date" required>
        <label for="time">Time:</label>
        <input type="time" name="time" id="time" required>
        <label for="description">Description:</label>
        <textarea name="description" id="description" required></textarea>
        <label for="category">Category:</label>
        <select name="category" id="category">
          <option value="">Select category</option>
          <option value="Music">Music</option>
          <option value="Nightlife">Nightlife</option>
          <option value="Arts & Culture">Arts & Culture</option>
          <option value="Education">Education</option>
          <option value="Sports & Fitness">Sports & Fitness</option>
          <option value="Social">Social</option>
          <option value="Food & Drink">Food & Drink</option>
          <option value="Charity">Charity</option>
          <option value="Seasonal">Seasonal</option>
          <option value="Other">Other</option>
        </select>
        <label for="displayLocation">Short Address (Optional):</label>
        <input type="text" name="displayLocation" id="displayLocation" placeholder="Store name or short address">
        <label for="poster">Event Poster (optional):</label>
        <input type="file" name="poster" id="poster" accept="image/*">
        <div class="map-container">
          <div id="mapCreate"></div>
        </div>
        <input type="hidden" name="lat" id="createLat">
        <input type="hidden" name="lon" id="createLon">
        <input type="hidden" name="location" id="createLocation">
        <input type="hidden" name="city" id="createCity">
        <button type="submit">Create Event</button>
      </form>
    </div>
  </div>

  <!-- Modal for Editing an Event (Admin) -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close" id="editClose">&times;</span>
      <h2>Edit Event</h2>
      <form id="editEventForm" enctype="multipart/form-data">
        <input type="hidden" name="eventId" id="editEventId">
        <label for="editEventName">Event Name:</label>
        <input type="text" name="eventName" id="editEventName" required>
        <label for="editDate">Date:</label>
        <input type="date" name="date" id="editDate" required>
        <label for="editTime">Time:</label>
        <input type="time" name="time" id="editTime" required>
        <label for="editDescription">Description:</label>
        <textarea name="description" id="editDescription" required></textarea>
        <label for="editCategory">Category:</label>
        <select name="editCategory" id="editCategory">
          <option value="">Select category</option>
          <option value="Music">Music</option>
          <option value="Nightlife">Nightlife</option>
          <option value="Arts & Culture">Arts & Culture</option>
          <option value="Education">Education</option>
          <option value="Sports & Fitness">Sports & Fitness</option>
          <option value="Social">Social</option>
          <option value="Food & Drink">Food & Drink</option>
          <option value="Charity">Charity</option>
          <option value="Seasonal">Seasonal</option>
          <option value="Other">Other</option>
        </select>
        <label for="editDisplayLocation">Short Address (Optional):</label>
        <input type="text" name="displayLocation" id="editDisplayLocation" placeholder="Store name or short address">
        <label for="editPoster">Event Poster (optional):</label>
        <input type="file" name="poster" id="editPoster" accept="image/*">
        <div class="map-container">
          <div id="mapEdit"></div>
        </div>
        <input type="hidden" name="lat" id="editLat">
        <input type="hidden" name="lon" id="editLon">
        <input type="hidden" name="location" id="editLocation">
        <input type="hidden" name="city" id="editCity">
        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2025 Eventorama</p>
  </footer>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script src="script.js"></script>
</body>
</html>
