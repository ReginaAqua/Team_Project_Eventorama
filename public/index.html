<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Calendar - Map Integration</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Leaflet Control Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
</head>
<body>
  <header>
    <div class="header-container">
      <!-- Logo -->
      <div class="site-logo">
        <img src="images/eventorama_logo.png" alt="Eventorama Logo" width="80" height="80">
      </div>
      <!-- Navigation -->
      <nav class="main-nav">
        <button id="loginBtn">Login</button>
        <button id="signupBtn">Sign Up</button>
        <button id="logoutBtn" style="display:none;">Logout</button>
      </nav>
    </div>
  </header>

  <!-- Modal for Login/Sign Up -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="authForm">
        <h2 id="modalTitle">Login</h2>
        <form id="loginForm">
          <input type="hidden" name="action" value="login">
          <label for="username">Username:</label>
          <input type="text" name="username" required>
          <label for="password">Password:</label>
          <input type="password" name="password" required>
          <button type="submit">Submit</button>
        </form>
        <form id="signupForm" style="display:none;">
          <input type="hidden" name="action" value="register">
          <label for="username">Username:</label>
          <input type="text" name="username" required>
          <label for="password">Password:</label>
          <input type="password" name="password" required>
          <button type="submit">Register</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal for Editing Event (Admin) -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close" id="editClose">&times;</span>
      <h2>Edit Event</h2>
      <form id="editEventForm" enctype="multipart/form-data">
        <input type="hidden" name="eventId" id="editEventId">

        <label for="editEventName">Event Name:</label>
        <input type="text" name="eventName" id="editEventName" required>

        <label for="editDate">Date:</label>
        <input type="date" name="date" id="editDate" required>

        <label for="editTime">Time:</label>
        <input type="time" name="time" id="editTime" required>

        <label for="editDescription">Description:</label>
        <textarea name="description" id="editDescription" required></textarea>

        <label for="editDisplayLocation">Short Address (Optional):</label>
        <input type="text" name="displayLocation" id="editDisplayLocation" placeholder="Store name or short address">

        <label for="editPoster">Event Poster (optional):</label>
        <input type="file" name="poster" id="editPoster" accept="image/*">

        <!-- Map for selecting full (long) address during editing -->
        <div class="map-container">
          <div id="mapEdit"></div>
        </div>
        <!-- Hidden fields to store lat, lon, and full address -->
        <input type="hidden" name="lat" id="editLat">
        <input type="hidden" name="lon" id="editLon">
        <input type="hidden" name="location" id="editLocation">

        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <main>
    <!-- Left column: Date picker & Create Event -->
    <section class="sidebar-left">
      <div class="date-picker">
        <h3>Select a Date to View Events</h3>
        <input type="date" id="viewDate">
        <button id="viewDateBtn">View Events</button>
      </div>

      <section id="createEventSection" style="display:none;">
        <h3>Create Event</h3>
        <form id="createEventForm" enctype="multipart/form-data">
          <label for="eventName">Event Name:</label>
          <input type="text" name="eventName" required>

          <label for="date">Date:</label>
          <input type="date" name="date" required>

          <label for="time">Time:</label>
          <input type="time" name="time" required>

          <label for="description">Description:</label>
          <textarea name="description" required></textarea>

          <label for="displayLocation">Short Address (Optional):</label>
          <input type="text" name="displayLocation" placeholder="Store name or short address">

          <label for="poster">Event Poster:</label>
          <input type="file" name="poster" accept="image/*">

          <!-- Map for selecting full (long) address during creation -->
          <div class="map-container">
            <div id="mapCreate"></div>
          </div>
          <!-- Hidden fields to store lat, lon, and full address -->
          <input type="hidden" name="lat" id="createLat">
          <input type="hidden" name="lon" id="createLon">
          <input type="hidden" name="location" id="createLocation">

          <button type="submit">Create Event</button>
        </form>
      </section>
    </section>

    <!-- Right column: Event Listing -->
    <section class="main-listing">
      <h2>All Events</h2>
      <div id="calendar"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 Eventorama</p>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Leaflet Control Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script src="script.js"></script>
</body>
</html>
